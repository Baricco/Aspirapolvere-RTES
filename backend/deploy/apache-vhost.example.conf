# VirtualHost di Apache per Maurice (esempio: si installa al momento del deploy, docs/app.md sezione 12).
# <server> sta al posto del dominio vero, che non va scritto in nessun file versionato.
# Servono i moduli proxy, proxy_http, headers e ssl.
<VirtualHost *:443>
    ServerName <server>

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/<nome-del-certificato>/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/<nome-del-certificato>/privkey.pem

    # la versione web dell'app (flutter build web) sulla pagina principale
    DocumentRoot /percorso/della/app/web
    <Directory /percorso/della/app/web>
        Require all granted
        FallbackResource /index.html
    </Directory>

    # /api passa a gunicorn, che ascolta solo sulla macchina. L'intestazione Host resta quella della richiesta:
    # il backend la confronta con Origin per rifiutare le richieste mandate da altri siti
    ProxyPreserveHost On
    ProxyPass        /api http://127.0.0.1:8730/api timeout=60
    ProxyPassReverse /api http://127.0.0.1:8730/api
    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>
